<div class="row mx-3 mt-3 bg-warning-subtle p-10 text-center">
    <h1>Bill</h1>
</div>

<form>
    <div class="row mx-3 mt-3">

        <!-- Customer -->
        <div class="col-2">
            <label>Customer</label>

            <select
                name="customerId"
                class="form-control"
                [(ngModel)]="bills.customerId">

                <option value="">Select Customer</option>

                <option
                    *ngFor="let customer of customerList"
                    [value]="customer.customerId">

                    {{ customer.customerEmail }}

                </option>
            </select>
        </div>

        <!-- Product -->
        <div class="col-2">
            <label>Product</label>

            <select
                name="productId"
                class="form-control"
                [(ngModel)]="bills.productId">

                <option value="">Select Product</option>

                <option
                    *ngFor="let product of productList"
                    [value]="product.productId">

                    {{ product.productName }}

                </option>
            </select>
        </div>

        <!-- Quantity -->
        <div class="col-2">
            <label>Quantity</label>

            <input
                type="number"
                class="form-control"
                name="quantity"
                placeholder="Quantity"
                [(ngModel)]="bills.quantity" 
                (ngModelChange)="calculateTotalAmount()">
        </div>

        <!-- Price -->
        <div class="col-2">
            <label>Price</label>

            <input
                type="number"
                class="form-control"
                name="price"
                placeholder="Price"
                [(ngModel)]="bills.price" 
                (ngModelChange)="calculateTotalAmount()">
        </div>

        <!-- Amount -->
        <div class="col-2">
            <label>Amount</label>

            <input
                type="number"
                class="form-control"
                name="amount"
                placeholder="Amount"
                [(ngModel)]="bills.amount" readonly>
        </div>

        <!-- Bill Date -->
        <div class="col-2">
            <label>Bill Date</label>

            <input
                type="date"
                class="form-control"
                name="billDate"
                [(ngModel)]="bills.billDate">
        </div>
         <div class="row mx-3 mt-3">
        <div class="col-2">
            <button
                type="button"
                class="btn btn-primary"
                (click)="addItem()">

                Add Item

            </button>
        </div>
    </div>

    </div>
</form>

<!-- Bill Items Table -->
<div class="row mx-3 mt-4">

    <div class="col-12">

        <table class="table table-bordered">

            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr *ngFor="let item of billList; let i = index">

                    <td>
                        {{ item.customerId }}
                    </td>

                    <td>
                        {{ item.productId }}
                    </td>

                    <td>
                        {{ item.quantity }}
                    </td>

                    <td>
                        {{ item.price }}
                    </td>

                    <td>
                        {{ item.amount }}
                    </td>

                    <td>
                        <button
                            type="button"
                            class="btn btn-danger"
                            (click)="removeItem(i)">

                            Remove

                        </button>
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
<div class="row mx-3 mt-3">

    <div class="col-10 text-end">
        <strong>Grand Total:</strong>
    </div>

    <div class="col-2">
        <input
            type="number"
            class="form-control"
            [value]="totalAmount"
            readonly>
    </div>

</div>
<div class=" col-11 d-flex justify-content-end mt-4">
    <button
    type="button"
    class="btn btn-sm btn-success mt-3 mx-6 "
   >
    Print Bill 
</button>
</div>
