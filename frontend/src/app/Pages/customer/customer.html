
<div class="row mx-3 bg-warning-subtle p-10 mt-3">
    <h2 class="text-center text-dark">Customers</h2>
</div>
<form action="" class="mt-3">
    <div class="row mx-3 mt-2">
        <div class="col-3">
            <label for="">Customer ID</label>
            <input type="text" clss="form-control" name="customerid" placeholder="Customer Id" [(ngModel)]="customerObj.customerId">
        </div>
        <div class="col-3">
            <label for="">Customer Email</label>
            <input type="text" clss="form-control" name="customeremail" placeholder="Customer Email" [(ngModel)]="customerObj.customerEmail">
        </div>
        <div class="col-3">
            <label for="">Customer Phone</label>
            <input type="text" clss="form-control" name="customerphone" placeholder="Customer Phone" [(ngModel)]="customerObj.customerPhone">
        </div>
        <div class="col-3">
            <label for="">Registration Date</label>
            <input type="date" clss="form-control" name="registrationdate" placeholder="Registration Date" [(ngModel)]="customerObj.registrationDate">
        </div>
    </div>
    <div class="row mx-3 mt-2">
        <div class="col-3 mt-3">
            @if(customerObj.customerId === 0){
                <button type="button" class="btn btn-primary" (click)="saveCustomer()">Save</button>
            }@else{
                <button  type="button" class="btn btn-success" (click)="updateCustomer()">Update</button>
            }
           
            
        </div>
    </div>
</form>
<table class="table table-bordered mt-3 mx-3">
    <thead>
        <tr>
            <th>Customer ID</th>
            <th>Customer Email</th>
            <th>Customer Phone</th>
            <th>Registration Date</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let customer of customers">
            <td>{{customer.customerId}}</td>
            <td>{{customer.customerEmail}}</td>
            <td>{{customer.customerPhone}}</td>
            <td>{{customer.registrationDate | date:'shortDate'}}</td>
            <td>
                <button type="button" class="btn btn-warning" (click)="editCustomer(customer)">Edit</button>
                <button type="button" class="btn btn-danger mx-2" (click)="deleteCustomer(customer.customerId)">Delete</button>
            </td>
        </tr>
    </tbody>
</table>
